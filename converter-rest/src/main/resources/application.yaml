# Defaults of the REST conversion service (data-model §8, research R5-R7). Operators override
# them with standard Spring Boot mechanisms (command line, environment, config files).
spring:
  application:
    name: ch-emed-converter-rest
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # contract: additionalProperties false; unknown properties are a malformed request
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # readiness is DOWN until the converter with its validation context is built (FR-016)
        readiness:
          include: readinessState,converter

converter:
  rest:
    max-document-size: 5MB
    max-request-size: 8MB
    # above the 15 s target of SC-002 for large plans (100 medications: 6-8 s alone)
    timeout: 20s
    # max-concurrent defaults to the number of available processors, queue-size to twice that
