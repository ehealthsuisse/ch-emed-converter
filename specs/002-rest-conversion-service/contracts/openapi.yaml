openapi: 3.1.0
info:
  title: CH EMED Converter REST API
  version: 1.0.0
  description: |
    Stateless conversion between CH EMED and other Swiss eMedication formats.
    The service has no authentication and no TLS; it MUST be operated behind an API gateway,
    reverse proxy or in a protected network (see docs/operations/rest-service.md).
    Requests contain patient data; nothing is stored.
servers:
  - url: /api/v1
paths:
  /conversions/{from}/{to}:
    post:
      operationId: convert
      summary: Convert a document from one format to another
      parameters:
        - name: from
          in: path
          required: true
          schema: { $ref: '#/components/schemas/FormatName' }
        - name: to
          in: path
          required: true
          schema: { $ref: '#/components/schemas/FormatName' }
        - name: strict
          in: query
          required: false
          description: Fail if clinically relevant information cannot be represented exactly.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        description: |
          The input document in its native form: CHMED16A JSON, FHIR JSON, or (only when
          `from` is `chmed16a`) the textual CHMED16A QR payload (`CHMED16A1…`).
        content:
          application/json:
            schema: { type: object }
          application/fhir+json:
            schema: { type: object }
          text/plain:
            schema:
              type: string
              pattern: '^CHMED16A'
      responses:
        '200':
          description: Conversion succeeded (possibly with warnings).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/ProblemRetry' }
        '504': { $ref: '#/components/responses/Problem' }
  /capabilities:
    get:
      operationId: capabilities
      summary: Supported conversions, options, pinned specification versions and limits
      responses:
        '200':
          description: Capabilities of the running service.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitiesResponse' }
  /openapi.yaml:
    get:
      operationId: openapi
      summary: This API description
      responses:
        '200':
          description: OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
components:
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' }
  headers:
    CorrelationId:
      schema: { type: string }
  responses:
    Problem:
      description: Failure (see errorType).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemRetry:
      description: Service busy or not ready (see errorType).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    FormatName:
      type: string
      description: Format name; the set grows with new format modules (see /capabilities).
      examples: [chmed16a, ch-emed]
      pattern: '^[a-z0-9-]{1,32}$'
    Outcome:
      type: string
      enum: [SUCCESS, SUCCESS_WITH_WARNINGS, FAILED]
    ConversionReport:
      description: Conversion report as defined in specs/001-chmed16a-ch-emed-conversion/contracts/conversion-report.schema.json
      type: object
      required: [reportVersion, converterVersion, source, target, specifications, outcome, entries]
      properties:
        reportVersion: { type: string }
        converterVersion: { type: string }
        source: { type: string }
        target: { type: string }
        specifications:
          type: object
          additionalProperties: { type: string }
        outcome: { $ref: '#/components/schemas/Outcome' }
        entries:
          type: array
          items:
            type: object
            required: [severity, code, phase, path, message, clinicalLoss]
            properties:
              severity: { type: string, enum: [ERROR, WARNING, INFORMATION] }
              code: { type: string }
              phase: { type: string, enum: [PARSE, VALIDATE_INPUT, MAP, VALIDATE_OUTPUT] }
              path: { type: string }
              targetPath: { type: string }
              message: { type: string }
              clinicalLoss: { type: boolean }
    ConversionResponse:
      type: object
      required: [outcome, correlationId, report, output]
      properties:
        outcome:
          type: string
          enum: [SUCCESS, SUCCESS_WITH_WARNINGS]
        correlationId: { type: string }
        report: { $ref: '#/components/schemas/ConversionReport' }
        output:
          type: object
          description: Output document, byte-identical to the library result (CHMED16A JSON or FHIR JSON).
    ErrorType:
      type: string
      enum:
        - MALFORMED_REQUEST
        - UNSUPPORTED_CONVERSION
        - REQUEST_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_INPUT
        - CONVERSION_FAILED
        - SERVICE_BUSY
        - NOT_READY
        - CONVERSION_TIMEOUT
        - INTERNAL_ERROR
    ConversionPair:
      type: object
      required: [from, to]
      properties:
        from: { $ref: '#/components/schemas/FormatName' }
        to: { $ref: '#/components/schemas/FormatName' }
    Problem:
      type: object
      description: RFC 9457 problem details with extensions.
      required: [type, title, status, errorType, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorType: { $ref: '#/components/schemas/ErrorType' }
        correlationId: { type: string }
        report: { $ref: '#/components/schemas/ConversionReport' }
        supportedConversions:
          type: array
          items: { $ref: '#/components/schemas/ConversionPair' }
    CapabilitiesResponse:
      type: object
      required: [converterVersion, conversions, options, specifications, limits]
      properties:
        converterVersion: { type: string }
        conversions:
          type: array
          items: { $ref: '#/components/schemas/ConversionPair' }
        options:
          type: array
          items:
            type: object
            required: [name, type, default]
            properties:
              name: { type: string }
              type: { type: string }
              default: {}
              description: { type: string }
        specifications:
          type: object
          additionalProperties: { type: string }
        limits:
          type: object
          required: [maxRequestSizeBytes, timeoutSeconds]
          properties:
            maxRequestSizeBytes: { type: integer }
            timeoutSeconds: { type: integer }
